name: create-github-secret-log

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write secret value to log file
        env:
          EXAMPLE: ${{ secrets.EXAMPLE }}
        run: |
          mkdir -p logs
          echo "$EXAMPLE" > logs/create_github_secret.log

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push log file
        run: |
          git add logs/create_github_secret.log
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: update create_github_secret.log [skip ci]"
          git push