# ==============================================================================
#  version: 4.14  (robust priority-packages parsing, prerelease support, 20 MB chunks)
#  Offline NuGet Feed Builder for Visual Studio 2026 Community
# ==============================================================================

name: Download NuGet Packages Offline

on:
  workflow_dispatch:
    inputs:
      priority_packages:
        description: |
          **Packages you definitely need** (comma‑separated).
          Optionally add @version, e.g. Newtonsoft.Json@13.0.3.
        type: string
        default: ''
      skip_top_packages:
        description: 'Check to download ONLY the priority packages (ignore popular).'
        type: boolean
        required: false
        default: false
      search_term:
        description: 'Keyword to filter top packages (e.g. maui, excel). Leave empty for all.'
        type: string
        default: ''
      max_size_gb:
        description: 'Maximum feed size in GB (only for top packages). Default: 10.'
        type: string
        default: '10'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 600
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # OPTIONAL TEST PUSH (API-based, to verify token)
      # ---------------------------------------------------------------
      - name: Test push (verify PAT can write to repo via API)
        shell: pwsh
        env:
          GH_PAT: ${{ secrets.GH_TOKEN }}
        run: |
          $token = $env:GH_PAT
          $repo = $env:GITHUB_REPOSITORY
          $branch = $env:GITHUB_REF_NAME
          $url = "https://api.github.com/repos/$repo/contents/test.txt"
          $headers = @{ Authorization = "Bearer $token" }
          $testContent = "Test push from run ${{ github.run_id }} at $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          $enc = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($testContent))
          $sha = try { (Invoke-RestMethod $url -Headers $headers -ErrorAction SilentlyContinue).sha } catch { $null }
          $body = @{ message="Test push"; content=$enc; branch=$branch }
          if ($sha) { $body.sha = $sha }
          try {
            Invoke-RestMethod $url -Method Put -Headers $headers -Body ($body | ConvertTo-Json -Compress) -ContentType "application/json"
            Write-Host "✅ Test push succeeded (API PUT)."
          } catch {
            Write-Host "❌ Test push FAILED: $($_.Exception.Message)"
            throw "Test push failed – check PAT secret (GH_TOKEN) and branch protection."
          }

      - name: Setup .NET SDK (Visual Studio 2026 compatible)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install workloads (MAUI, WASM, Aspire) – only if top packages are not skipped
        if: inputs.skip_top_packages != 'true' && inputs.skip_top_packages != true
        run: |
          dotnet workload install maui wasm-tools aspire --skip-sign-check
          dotnet workload list

      - name: Compute cache key
        id: cache-key
        shell: pwsh
        run: |
          $key = "nuget-offline-feed-v414-" +
            "search-${{ inputs.search_term }}" +
            "-maxGB-${{ inputs.max_size_gb }}" +
            "-topskip-${{ inputs.skip_top_packages }}"
          "key=$key" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create output directory and log folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\nuget_offline_packages" | Out-Null
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\logs" | Out-Null
          echo "FEED_DIR=${{ github.workspace }}\nuget_offline_packages" >> $env:GITHUB_ENV
          echo "LOGS_DIR=${{ github.workspace }}\logs" >> $env:GITHUB_ENV

      # ---------------------------------------------------------------
      # Clear old log so we only see the current run
      # ---------------------------------------------------------------
      - name: Clear old log file
        shell: pwsh
        run: |
          $logFile = Join-Path $env:LOGS_DIR "get_vs_nugets.log"
          "" | Out-File -FilePath $logFile -Encoding utf8
          Write-Host "Log file cleared."

      # ---------- PRIORITY PACKAGES (FIXED + DEBUG) ----------
      - name: Download priority packages (full restore if possible, else exact .nupkg)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $feedDir = $env:FEED_DIR
          $logFile = Join-Path $env:LOGS_DIR "get_vs_nugets.log"

          function Write-Log {
            param([string]$msg)
            $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
            $line = "[$timestamp] $msg"
            Write-Host $line
            Add-Content -Path $logFile -Value $line
          }

          Write-Log "Workflow version: 4.14 (robust parsing + prerelease support)"
          Write-Log "===== Priority packages download started ====="

          $rawInput = @"
          ${{ inputs.priority_packages }}
          "@
          # Remove comments (whole lines starting with #) and line breaks
          $rawInput = $rawInput -replace '(?m)^\s*#.*$', '' -replace "`r`n", ' ' -replace "`n", ' '
          # Split, trim, and force into a real array
          $tokens = @($rawInput -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' })

          Write-Log "DEBUG raw input: [$rawInput]"
          Write-Log "DEBUG token count: $($tokens.Count)"
          for ($i = 0; $i -lt $tokens.Count; $i++) {
            Write-Log "DEBUG token $i : [$($tokens[$i])]"
          }

          if ($tokens.Count -eq 0) {
            Write-Log "No priority packages – nothing to download."
            exit 0
          }

          Write-Log "Processing $($tokens.Count) priority packages..."

          for ($i = 0; $i -lt $tokens.Count; $i++) {
            $tok = $tokens[$i]
            Write-Log "--- Processing: $tok ---"
            if ($tok -match '@') {
              $parts = $tok -split '@', 2
              $id = $parts[0].Trim()
              $ver = $parts[1].Trim()
              $hasVersion = $true
            } else {
              $id = $tok
              $ver = $null
              $hasVersion = $false
            }

            # For prerelease versions we must use the exact version (already includes the tag)
            # For latest stable we use "*-*" (which excludes prereleases by default)
            if ($hasVersion) {
              $pkgRef = "<PackageReference Include=`"$id`" Version=`"$ver`" />"
            } else {
              $pkgRef = "<PackageReference Include=`"$id`" Version=`"*-*`" />"
            }

            Write-Log "  PackageReference: $pkgRef"

            $tempCsproj = Join-Path $env:RUNNER_TEMP "prio_$([Guid]::NewGuid()).csproj"
            @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFrameworks>net10.0;net10.0-android;net10.0-ios;net10.0-maccatalyst;net10.0-windows10.0.19041.0</TargetFrameworks>
            </PropertyGroup>
            <ItemGroup>
              $pkgRef
            </ItemGroup>
          </Project>
          "@ | Out-File -FilePath $tempCsproj -Encoding UTF8

            Write-Log "  Temporary csproj created: $tempCsproj"

            $restoreOk = $false
            try {
              dotnet restore $tempCsproj --packages $feedDir 2>&1 | Out-File -Append -FilePath $logFile
              if ($LASTEXITCODE -eq 0) {
                $restoreOk = $true
                Write-Log "  Restore succeeded."
              } else {
                Write-Log "  Restore exited with code $LASTEXITCODE"
              }
            } catch {
              Write-Log "  Restore threw exception: $($_.Exception.Message)"
            }

            if (-not $restoreOk) {
              Write-Log "  Restore failed – applying fallback."
              if ($hasVersion) {
                Write-Log "  Downloading exact version $ver from NuGet V2 API..."
                $nupkgUrl = "https://www.nuget.org/api/v2/package/$id/$ver"
                $outFile = Join-Path $feedDir "$id.$ver.nupkg"
                try {
                  Invoke-WebRequest -Uri $nupkgUrl -OutFile $outFile -ErrorAction Stop
                  if (Test-Path $outFile) {
                    Write-Log "  Exact .nupkg saved: $outFile"
                  } else {
                    Write-Log "  WARNING: Download seemed to succeed, but file not found."
                  }
                } catch {
                  Write-Log "  Direct V2 download failed: $($_.Exception.Message)"
                  Write-Log "  Attempting dotnet package download as last resort..."
                  dotnet package download $id --version $ver --output $feedDir 2>&1 | Out-File -Append -FilePath $logFile
                  if ($LASTEXITCODE -ne 0) {
                    Write-Log "  dotnet package download also failed."
                  }
                  $global:LASTEXITCODE = 0
                }
              } else {
                Write-Log "  Downloading bare .nupkg (prerelease allowed)."
                dotnet package download $id --prerelease --output $feedDir 2>&1 | Out-File -Append -FilePath $logFile
                if ($LASTEXITCODE -ne 0) {
                  Write-Log "  Failed to download $id – skipped."
                } else {
                  Write-Log "  Downloaded $id successfully."
                }
                $global:LASTEXITCODE = 0
              }
            }

            Remove-Item $tempCsproj -Force -ErrorAction SilentlyContinue
          }

          Write-Log "===== Priority packages processing completed ====="
          exit 0

      # ---------- TOP PACKAGES (unchanged) ----------
      - name: Measure current feed size
        id: measure
        shell: pwsh
        run: |
          $feedDir = $env:FEED_DIR
          $logFile = Join-Path $env:LOGS_DIR "get_vs_nugets.log"
          function Write-Log {
            param([string]$msg)
            $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
            $line = "[$timestamp] $msg"
            Write-Host $line
            Add-Content -Path $logFile -Value $line
          }
          Write-Log "===== Measuring feed size ====="
          $size = (Get-ChildItem -Path $feedDir -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $mb = [math]::Round($size / 1MB, 1)
          Write-Log "Feed size: $mb MB"
          echo "CURRENT_SIZE=$size" >> $env:GITHUB_ENV

      - name: Debug inputs
        shell: pwsh
        run: |
          Write-Host "skip_top_packages = ${{ inputs.skip_top_packages }}"
          Write-Host "max_size_gb = ${{ inputs.max_size_gb }}"
          Write-Host "search_term = ${{ inputs.search_term }}"

      - name: Fetch and process top packages
        if: inputs.skip_top_packages != 'true' && inputs.skip_top_packages != true && inputs.max_size_gb != '0'
        shell: pwsh
        timeout-minutes: 540
        run: |
          $feedDir = $env:FEED_DIR
          $maxSizeBytes = [double]${{ inputs.max_size_gb }} * 1GB
          $currentSize = [long]$env:CURRENT_SIZE
          $searchTerm = "${{ inputs.search_term }}"
          $baseUrl = "https://azuresearch-usnc.nuget.org/query"
          $ids = [System.Collections.ArrayList]::new()
          $skip = 0
          do {
            $q = if ($searchTerm) { "q=$searchTerm" } else { "q=" }
            $uri = "$baseUrl`?$q&skip=$skip&take=100&prerelease=false&sortby=totalDownloads-desc"
            Write-Host "API: $uri"
            try { $resp = Invoke-RestMethod $uri -TimeoutSec 30 } catch { break }
            if (-not $resp.data -or $resp.data.Count -eq 0) { break }
            foreach ($hit in $resp.data) {
              if ($ids.Count -ge 2000) { break }
              $ids.Add($hit.id) | Out-Null
            }
            $skip += 100
          } while ($true -and $skip -lt 5000)

          if ($ids.Count -eq 0) { Write-Host "No top packages found." ; exit 0 }
          Write-Host "Fetched $($ids.Count) top package IDs."

          $processed = 0
          foreach ($id in $ids) {
            if ($currentSize -ge $maxSizeBytes) {
              Write-Host "Size limit reached. Stopping."
              break
            }
            Write-Host "--- Processing: $id ---"
            $tempCsproj = Join-Path $env:RUNNER_TEMP "top_$([Guid]::NewGuid()).csproj"
            @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFrameworks>net10.0;net10.0-android;net10.0-ios;net10.0-maccatalyst;net10.0-windows10.0.19041.0</TargetFrameworks>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="$id" Version="*" />
            </ItemGroup>
          </Project>
          "@ | Out-File -FilePath $tempCsproj -Encoding UTF8

            $restoreOk = $false
            try {
              dotnet restore $tempCsproj --packages $feedDir 2>&1 | Out-Null
              if ($LASTEXITCODE -eq 0) { $restoreOk = $true }
            } catch { }

            if (-not $restoreOk) {
              Write-Host "  Restore failed – downloading as bare .nupkg (no deps)."
              dotnet package download $id --output $feedDir 2>&1 | Out-Null
            }

            $currentSize = (Get-ChildItem -Path $feedDir -Recurse -File | Measure-Object -Property Length -Sum).Sum
            $mb = [math]::Round($currentSize / 1MB, 1)
            Write-Host "  Current feed size: $mb MB"
            $processed++
          }

          Write-Host "Top packages processed: $processed"
          echo "TOP_COUNT=$processed" >> $env:GITHUB_ENV

      # ---------------------------------------------------------------
      # 1. CLEANUP & ZIP
      # ---------------------------------------------------------------
      - name: Clean up old chunk folder
        shell: pwsh
        run: |
          $chunks = "Download"
          if (Test-Path $chunks) {
            Remove-Item -Recurse -Force $chunks
            Write-Host "Cleaned old chunk folder."
          } else {
            Write-Host "No old chunk folder found."
          }

      - name: Package offline feed into ZIP
        shell: pwsh
        run: |
          $feedDir = $env:FEED_DIR
          $zipPath = "${{ runner.temp }}\NuGetOfflineFeed_${{ github.run_id }}.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::Open($zipPath, 'Create')
          Get-ChildItem -Path $feedDir -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($feedDir.Length + 1)
            [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $_.FullName, $rel, 'Optimal')
          }
          $zip.Dispose()
          Write-Host "ZIP size: $([math]::Round((Get-Item $zipPath).Length/1MB,1)) MB"
          echo "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV

      # ---------------------------------------------------------------
      # 2. RENAME ZIP + SPLIT INTO 20 MB CHUNKS
      # ---------------------------------------------------------------
      - name: Rename and split ZIP into 20 MB chunks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = $env:ZIP_PATH
          $chunks = "Download"
          $logFile = Join-Path $env:LOGS_DIR "get_vs_nugets.log"

          function Write-Log {
            param([string]$msg)
            $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
            $line = "[$timestamp] $msg"
            Write-Host $line
            Add-Content -Path $logFile -Value $line
          }

          Write-Log "===== Renaming ZIP for deterministic chunk names ====="
          $plainName = "NuGetOfflineFeed"
          $fixedZip = Join-Path (Split-Path $zip) $plainName
          Rename-Item -Path $zip -NewName $plainName -Force
          Write-Log "Renamed ZIP to $fixedZip"

          New-Item -ItemType Directory -Force -Path $chunks | Out-Null

          $pythonCmd = if (Get-Command python3 -ErrorAction SilentlyContinue) { "python3" } else { "python" }
          Write-Log "Using Python: $pythonCmd with --chunk-size 20"
          & $pythonCmd python/chunker.py --file $fixedZip --output-dir $chunks --chunk-size 20
          Write-Log "chunker.py finished (20 MB chunks)."

          echo "CHUNKS_DIR=$chunks" >> $env:GITHUB_ENV

      # ---------------------------------------------------------------
      # 3. UPLOAD CHUNKS (20 MB each – CONFIRMED WORKING)
      # ---------------------------------------------------------------
      - name: Upload chunks to repository
        shell: pwsh
        env:
          GH_PAT: ${{ secrets.GH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $chunks = $env:CHUNKS_DIR
          $logFile = Join-Path $env:LOGS_DIR "get_vs_nugets.log"

          function Write-Log {
            param([string]$msg)
            $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
            $line = "[$timestamp] $msg"
            Write-Host $line
            Add-Content -Path $logFile -Value $line
          }

          Write-Log "===== Uploading chunks to repository ====="
          $token = $env:GH_PAT
          if (-not $token) {
            Write-Log "❌ GH_PAT is empty – check secret GH_TOKEN"
            exit 1
          }

          $repo = $env:GITHUB_REPOSITORY
          $branch = $env:GITHUB_REF_NAME
          $base = "https://api.github.com/repos/$repo/contents"
          $headers = @{ Authorization = "Bearer $token" }

          Get-ChildItem -Path $chunks -File | ForEach-Object {
            $f = $_.FullName
            $remote = "$chunks/$($_.Name)" -replace '\\','/'
            Write-Log "Uploading $remote ($((Get-Item $f).Length) bytes)"
            $bytes = [System.IO.File]::ReadAllBytes($f)
            $enc = [Convert]::ToBase64String($bytes)
            $url = "$base/$remote"
            $sha = try { (Invoke-RestMethod $url -Headers $headers -ErrorAction SilentlyContinue).sha } catch { $null }
            $body = @{ message="Add $($_.Name)"; content=$enc; branch=$branch }
            if ($sha) { $body.sha = $sha }
            $retry = 0; $ok = $false
            do {
              try {
                Invoke-RestMethod $url -Method Put -Headers $headers -Body ($body | ConvertTo-Json -Compress) -ContentType "application/json"
                Write-Host "[OK] $($_.Name)"
                $ok = $true
              } catch {
                if ($retry -lt 2) { Start-Sleep -Seconds 10; $retry++ } else { throw }
              }
            } while (-not $ok)
            Start-Sleep -Milliseconds 500
          }
          Write-Log "All chunks uploaded successfully."

      # ---------------------------------------------------------------
      # 4. UPLOAD FINAL LOG (always runs)
      # ---------------------------------------------------------------
      - name: Upload final log to repository
        if: always()
        shell: pwsh
        env:
          GH_PAT: ${{ secrets.GH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $token = $env:GH_PAT
          if (-not $token) { Write-Host "No token for log upload."; exit 0 }
          $repo = $env:GITHUB_REPOSITORY
          $branch = $env:GITHUB_REF_NAME
          $url = "https://api.github.com/repos/$repo/contents/logs/get_vs_nugets.log"
          $headers = @{ Authorization = "Bearer $token" }
          $logFile = Join-Path $env:LOGS_DIR "get_vs_nugets.log"
          if (Test-Path $logFile) {
            $enc = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($logFile))
            $sha = try { (Invoke-RestMethod $url -Headers $headers -ErrorAction SilentlyContinue).sha } catch { $null }
            $body = @{ message="Update log"; content=$enc; branch=$branch }
            if ($sha) { $body.sha = $sha }
            Invoke-RestMethod $url -Method Put -Headers $headers -Body ($body | ConvertTo-Json -Compress) -ContentType "application/json"
            Write-Host "Log uploaded."
          } else {
            Write-Host "Log file not found, skipping upload."
          }