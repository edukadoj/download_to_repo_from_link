# ==============================================================================
# download.yml – Version 3.32
#   - Fast WARP verification (curl trace check, no IPv6 loop).
#   - YouTube connectivity test (10 s) kept for final verification.
#   - All other dependencies unchanged.
# ==============================================================================
name: Download (YouTube + Direct Link)

on:
  workflow_dispatch:
    inputs:
      urls_json:
        description: 'JSON array of URLs'
        required: true
      quality:
        description: 'Video quality (YouTube only)'
        required: true
        type: choice
        default: '720p'
        options:
          - '144p'
          - '360p'
          - '480p'
          - '720p'
          - '1080p'
          - 'best'
      sub_lang:
        description: 'Subtitles language (YouTube only)'
        required: true
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'en (English)'
          - 'fa (Persian)'
      burner_subs:
        description: 'Burn subtitles into video?'
        type: boolean
        default: false
      compress_video:
        description: 'Compress video (CRF 26)'
        type: boolean
        default: false
      use_cache:
        description: 'Enable pip caching'
        type: boolean
        default: true
      folder_name:
        description: 'Folder to store downloads'
        required: false
        default: 'Download'

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      KEY: ${{ secrets.KEY }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Clean up old downloads and logs
        run: |
          rm -rf "${{ github.event.inputs.folder_name }}"
          rm -f url_list.txt file_list.txt downloader.js pending_urls.txt
          mkdir -p logs
          echo "" > logs/download.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up old downloads" || true
          git pull --rebase || true
          git push || true

      - name: Restore pip cache
        if: ${{ inputs.use_cache }}
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-download-v1

      # ══════════════════════════════════════════════════════════
      # WARP – official client, VPN mode (fast verification)
      # ══════════════════════════════════════════════════════════
      - name: Cache Cloudflare WARP package
        uses: actions/cache@v4
        id: warp-cache
        with:
          path: /tmp/warp-pkg
          key: cloudflare-warp-${{ runner.os }}-${{ hashFiles('.github/workflows/command_mouse_keyboard.yml') }}

      - name: Download WARP (first time)
        if: steps.warp-cache.outputs.cache-hit != 'true'
        run: |
          {
            echo "[$(date +%H:%M:%S)] Downloading WARP package"
            sudo apt-get update -qq
            sudo apt-get install -y curl gnupg apt-transport-https
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update -qq
            sudo apt-get install -y --download-only cloudflare-warp
            mkdir -p /tmp/warp-pkg
            cp /var/cache/apt/archives/cloudflare-warp*.deb /tmp/warp-pkg/
          } 2>&1 | tee -a logs/download.log

      - name: Install WARP dependencies first
        run: |
          {
            echo "[$(date +%H:%M:%S)] Installing WARP dependencies"
            sudo apt-get update -qq
            sudo apt-get install -y desktop-file-utils libayatana-appindicator3-1 bubblewrap libwebkit2gtk-4.1-0 libjavascriptcoregtk-4.1-0 || true
          } 2>&1 | tee -a logs/download.log

      - name: Install WARP (from cache)
        run: |
          {
            echo "[$(date +%H:%M:%S)] Installing WARP"
            sudo dpkg -i /tmp/warp-pkg/cloudflare-warp*.deb || true
            sudo apt-get update -qq
            sudo apt-get install -f -y --fix-missing || sudo apt-get install -f -y
          } 2>&1 | tee -a logs/download.log

      - name: Start Cloudflare WARP (fast check)
        run: |
          {
            echo "[$(date +%H:%M:%S)] Registering WARP"
            sudo warp-cli --accept-tos registration new
            echo "[$(date +%H:%M:%S)] Switching to full‑tunnel mode (warp)"
            sudo warp-cli --accept-tos mode warp
            echo "[$(date +%H:%M:%S)] Connecting"
            sudo warp-cli --accept-tos connect
            sleep 5
            echo "[$(date +%H:%M:%S)] Quick warp status:"
            curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -E "warp|ip|loc" || true
          } 2>&1 | tee -a logs/download.log

      # ── Install system / Python packages ──
      - name: Install system dependencies
        run: |
          {
            echo "[$(date +%H:%M:%S)] Installing system dependencies"
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg libgbm1 libwoff1 libopus0 libwebpdemux2 libharfbuzz-icu0 libenchant-2-2 libsecret-1-0 libhyphen0 libmanette-0.2-0 libflite1
          } 2>&1 | tee -a logs/download.log

      - name: Install Python packages
        run: |
          {
            echo "[$(date +%H:%M:%S)] Installing Python packages"
            pip3 install --upgrade yt-dlp "yt-dlp[default,curl-cffi]" requests
            pip3 install playwright
            sudo pip3 install cryptography
            sudo pip3 install secretstorage
            echo "[$(date +%H:%M:%S)] ✅ Python packages installed"
          } 2>&1 | tee -a logs/download.log

      # ── YouTube connectivity test (fast, proves both WARP and YouTube work) ──
      - name: Test YouTube connectivity
        run: |
          {
            echo "[$(date +%H:%M:%S)] Testing YouTube connectivity..."
            echo "--- curl YouTube homepage ---"
            curl -sI https://www.youtube.com/ | head -20
            echo ""
            echo "--- yt-dlp dry-run with verbose ---"
            yt-dlp --verbose --no-download --print-traffic https://www.youtube.com/watch?v=jNQXAC9IVRw
            echo "[$(date +%H:%M:%S)] YouTube connectivity test finished"
          } 2>&1 | tee -a logs/download.log

      # ── Profile loading ──
      - name: Download and load Chrome profile from repo
        run: |
          {
            echo "[$(date +%H:%M:%S)] Downloading latest profile cache from repo..."
            python3 -c '
          import os, sys, time, base64, hashlib, json, re, shutil, glob, tempfile, tarfile, io
          from cryptography.fernet import Fernet
          from pathlib import Path

          sys.path.insert(0, "python")
          from uploader import reassemble_flat

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ["GITHUB_REF_NAME"]
          cache_dir = ".profile_cache"
          profile_dir = "/tmp/chrome_profile"

          def api_url(path):
              return f"https://api.github.com/repos/{repo}/contents/{path}?ref={branch}"

          def download_file(path):
              import urllib.request
              req = urllib.request.Request(api_url(path))
              req.add_header("Authorization", f"token {token}")
              req.add_header("Accept", "application/vnd.github.v3.raw")
              with urllib.request.urlopen(req) as resp:
                  return resp.read()

          def list_files(dir_path):
              url = f"https://api.github.com/repos/{repo}/git/trees/{branch}?recursive=1"
              import urllib.request
              req = urllib.request.Request(url)
              req.add_header("Authorization", f"token {token}")
              with urllib.request.urlopen(req) as resp:
                  tree = json.loads(resp.read())["tree"]
              return [(it["path"], it["sha"]) for it in tree if it["path"].startswith(dir_path)]

          entries = list_files(cache_dir)
          subdirs = {}
          for p, sha in entries:
              parts = p.split("/")
              if len(parts) >= 3:
                  ts = parts[1]
                  if re.match(r"^\d{8}_\d{6}$", ts):
                      subdirs.setdefault(ts, []).append((p, sha))
          if not subdirs:
              print("No profile cache folders found – skipping profile load.")
              sys.exit(0)

          newest = max(subdirs.keys())
          print(f"Newest cache folder: {newest}")
          os.makedirs("/tmp/reassemble", exist_ok=True)

          for rel_path, sha in subdirs[newest]:
              data = download_file(rel_path)
              dest = os.path.join("/tmp/reassemble", os.path.basename(rel_path))
              with open(dest, "wb") as f:
                  f.write(data)
              print(f"  Downloaded {os.path.basename(rel_path)} ({len(data)} bytes)")

          reassemble_flat("/tmp/reassemble", "/tmp/reassembled")
          reassembled_files = os.listdir("/tmp/reassembled")
          if not reassembled_files:
              print("No reassembled file – skipping profile load.")
              shutil.rmtree("/tmp/reassemble", ignore_errors=True)
              shutil.rmtree("/tmp/reassembled", ignore_errors=True)
              sys.exit(0)

          key = os.environ["KEY"]
          enc_key = base64.urlsafe_b64encode(hashlib.sha256(key.encode()).digest())
          fernet = Fernet(enc_key)

          for fname in reassembled_files:
              fpath = os.path.join("/tmp/reassembled", fname)
              with open(fpath, "rb") as f:
                  encrypted = f.read()
              decrypted = fernet.decrypt(encrypted)
              shutil.rmtree(profile_dir, ignore_errors=True)
              with tarfile.open(fileobj=io.BytesIO(decrypted), mode="r:gz") as tar:
                  tar.extractall("/tmp")
              print("✅ Profile extracted to /tmp/chrome_profile")
              break

          shutil.rmtree("/tmp/reassemble", ignore_errors=True)
          shutil.rmtree("/tmp/reassembled", ignore_errors=True)
          '
            echo "[$(date +%H:%M:%S)] Profile load completed."
          } 2>&1 | tee -a logs/download.log

      # ── Install Playwright browsers (cached) ────────
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('.github/workflows/download.yml') }}

      - name: Install Playwright (with system deps)
        run: |
          {
            echo "[$(date +%H:%M:%S)] Installing Playwright"
            npm init -y
            npm install playwright
            npx playwright install --with-deps chromium
            echo "[$(date +%H:%M:%S)] Playwright ready"
          } 2>&1 | tee -a logs/download.log

      # ── Extract cookies using Playwright ────────────────────
      - name: Extract YouTube cookies from profile
        run: |
          if [ -d /tmp/chrome_profile ]; then
            {
              echo "[$(date +%H:%M:%S)] Extracting cookies..."
              cat > extract_cookies.js << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launchPersistentContext('/tmp/chrome_profile', {
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox'],
            });
            const page = await browser.newPage();
            await page.goto('https://www.youtube.com', { waitUntil: 'domcontentloaded', timeout: 30000 });
            const cookies = await browser.cookies();
            const fs = require('fs');
            let netscape = '# Netscape HTTP Cookie File\n';
            for (const c of cookies) {
              const domain = c.domain.startsWith('.') ? c.domain : '.' + c.domain;
              netscape += `${domain}\tTRUE\t${c.path}\t${c.secure ? 'TRUE' : 'FALSE'}\t${c.expires === -1 ? 0 : c.expires}\t${c.name}\t${c.value}\n`;
            }
            fs.writeFileSync('cookies.txt', netscape);
            console.log(`✅ Exported ${cookies.length} cookies`);
            await browser.close();
          })();
          EOF
              node extract_cookies.js
            } 2>&1 | tee -a logs/download.log
          else
            echo "⚠️ Profile not loaded – skipping cookie extraction." | tee -a logs/download.log
          fi

      # ── Main processing ──────────────────────────────────────
      - name: Run download.py
        env:
          URLS_JSON: ${{ github.event.inputs.urls_json }}
          QUALITY: ${{ github.event.inputs.quality }}
          SUB_LANG: ${{ github.event.inputs.sub_lang }}
          BURN_SUBS: ${{ github.event.inputs.burner_subs }}
          COMPRESS_VIDEO: ${{ github.event.inputs.compress_video }}
          FOLDER_NAME: ${{ github.event.inputs.folder_name }}
          COOKIES_FILE: cookies.txt
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
          XDG_CURRENT_DESKTOP: GNOME
        run: python3 python/download.py

      # ── Clean up temporary files before committing ─────────
      - name: Clean up temporary files
        if: always()
        run: rm -f pending_urls.txt url_list.txt file_list.txt

      # ── Commit log immediately (even on failure) ─────────────
      - name: Commit download log
        if: always()
        run: |
          git add logs/download.log 2>/dev/null || true
          git commit -m "Download run log" || true
          git pull --rebase --strategy-option ours || true
          git push || true

      # ── Final log commit ─────────────────────────────────────
      - name: Commit log and output folder
        if: always()
        run: |
          git add logs/download.log "${{ github.event.inputs.folder_name }}" 2>/dev/null || true
          git commit -m "Download run log and files" || true
          git pull --rebase --strategy-option ours || true
          git push || true